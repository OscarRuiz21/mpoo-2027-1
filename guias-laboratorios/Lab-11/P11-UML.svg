<text x="20" y="862" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1d2b45">Linea continua con triangulo: extends (es un).  Punteada con triangulo: implements (sabe hacer).</text>
<text x="20" y="882" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1d2b45">Cursiva: abstracto, cada clase lo escribe con @Override.  Amarillo: final, el ultimo eslabon.</text>
<text x="20" y="902" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1d2b45">En cada clase aparece solo lo que esa clase escribe; lo heredado no se repite.</text>
