# Validación semanal de las instrucciones del Lab 0 (MPOO 2027-1)
# Copiar a .github/workflows/ del repo del curso. Corre cada lunes y a mano.
# Nota: los runners de GitHub no traen winget, así que la vía winget se valida
# contra los manifiestos de microsoft/winget-pkgs y la ejecución real en Windows
# usa el instalador .msi de Adoptium (la vía alterna de la misma guía).
name: Validar instrucciones del Lab 0

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'   # lunes 07:00 CDMX

jobs:
  flujo-alumno:
    name: Flujo del alumno en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash        # en Windows esto es Git Bash, igual que en clase
    steps:
      - name: Instalar JDK 21 como dice la guía (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q openjdk-21-jdk

      - name: Instalar JDK 21 como dice la guía (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask temurin@21

      - name: Instalar JDK 21 con el .msi de Adoptium (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sL -o temurin.msi "https://api.adoptium.net/v3/installer/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse"
          MSYS_NO_PATHCONV=1 powershell -Command "Start-Process msiexec -ArgumentList '/i temurin.msi /quiet ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJavaHome' -Wait"
          ls -d "/c/Program Files/Eclipse Adoptium/"jdk-21* | head -1 | sed 's|$|/bin|' | sed 's|^/c/|C:/|' >> "$GITHUB_PATH"

      - name: Verificación de la Parte 1
        run: |
          java -version 2>&1 | grep '"21'
          javac -version | grep '^javac 21'
          git --version

      - name: HolaMundo de la Parte 2 (compilar, ejecutar, romper)
        run: |
          mkdir -p ~/mpoo && cd ~/mpoo
          printf 'public class HolaMundo {\n    public static void main(String[] args) {\n        System.out.println("Hola, mundo");\n    }\n}\n' > HolaMundo.java
          javac HolaMundo.java
          test "$(java HolaMundo)" = "Hola, mundo"
          sed 's/);$/)/' HolaMundo.java > R.java && mv R.java HolaMundo.java
          javac HolaMundo.java 2>&1 | grep -q "';' expected"

      - name: Flujo Git de las Partes 3 y 4
        run: |
          git config --global user.name "CI Lab0"
          git config --global user.email "ci@example.com"
          git clone -q https://github.com/octocat/Hello-World.git hw && cd hw
          mkdir -p entregas/ci/lab00 && cp ~/mpoo/HolaMundo.java entregas/ci/lab00/
          git add entregas/ci/lab00
          git commit -q -m "Lab 0: entorno verificado y hola mundo"

  paquetes-y-urls:
    name: IDs de paquetes y URLs de la guía
    runs-on: ubuntu-latest
    steps:
      - name: IDs de winget existen en microsoft/winget-pkgs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for p in "e/EclipseAdoptium/Temurin/21/JDK" "g/Git/Git" "j/JetBrains/IntelliJIDEA"; do
            gh api "repos/microsoft/winget-pkgs/contents/manifests/$p" --jq 'type' | grep -q array
          done

      - name: Casks de brew vigentes y no deprecados
        run: |
          for c in temurin@21 intellij-idea; do
            curl -sf "https://formulae.brew.sh/api/cask/$c.json" | jq -e '.deprecated == false' > /dev/null
          done

      - name: Snap de IntelliJ vigente
        run: |
          curl -sf -H "Snap-Device-Series: 16" "https://api.snapcraft.io/v2/snaps/info/intellij-idea" | jq -e '."channel-map" | length > 0' > /dev/null

      - name: Paquete de Arch vigente
        run: |
          curl -sf "https://archlinux.org/packages/search/json/?name=jdk21-openjdk" | jq -e '.results | length > 0' > /dev/null

      - name: URLs de la guía responden
        run: |
          for u in "https://adoptium.net/temurin/releases/?version=21" "https://brew.sh" "https://git-scm.com/download/win" "https://www.jetbrains.com/idea/download/"; do
            curl -sf -o /dev/null -L -A "Mozilla/5.0" "$u"
          done
